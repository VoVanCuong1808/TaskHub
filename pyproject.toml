[project]
name = "taskhub"
version = "0.1.0"
description = "TaskHub task management API with workspace RBAC and background assignment email"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "email-validator>=2.2.0",
    "pyjwt>=2.10.1",
    "pwdlib[argon2]>=0.2.1",
    "redis>=5.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]
